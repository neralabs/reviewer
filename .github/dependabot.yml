version: 2
updates:
  - package-ecosystem: npm
    directory: /poster
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      npm-minor-patch:
        update-types: [minor, patch]
  # The Rerail release the rerail module installs by default (rerail_package empty) and CI tests it with.
  - package-ecosystem: npm
    directory: /modules/rerail/pin
    schedule:
      interval: weekly
    open-pull-requests-limit: 1
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    groups:
      actions:
        patterns: ["*"]
