# Reusable workflow: gate -> review (Claude Code, read-only) -> post (neralabs-reviewer).
# Target repos call it with templates/caller.yml. See docs/architecture.md and docs/configuration.md.
#
# Credentials, by job:
#   gate     GITHUB_TOKEN (read) only: the reviewer's source is public, so the gate holds no app key
#            while it decides whether an event (any comment mentioning the handle) is a command.
#   review   GITHUB_TOKEN (read) for prepare. The model credential, in the review step only: with
#            provider anthropic, secret REVIEWER_ANTHROPIC_API_KEY as ANTHROPIC_API_KEY; with provider
#            bedrock, secret REVIEWER_BEDROCK_API_KEY (an Amazon Bedrock API key) as
#            AWS_BEARER_TOKEN_BEDROCK. Scope the key to invoking the model the caller names, and nothing
#            else (infra/ has an example for Bedrock).
#            The model runs with no shell, no network tools and no GitHub token.
#   post     GITHUB_TOKEN (read); a neralabs-reviewer token with pull-requests:write, contents:read
#            and organization members:read (GitHub ignores an app's team review requests without it)
#            on the calling repo.
#   rules    GITHUB_TOKEN (contents: read) for the checkout only, and RERAIL_PACKAGE_URL if the caller passes
#            it. Off unless the caller sets rerail_package or RERAIL_PACKAGE_URL: installs Rerail and runs a
#            deterministic `rerail scan` of the PR with the rules from the base branch. No model, no keys.
#   send     only RERAIL_REMOTE_URL and RERAIL_REMOTE_TOKEN; runs only when the caller sets send_results.
#            Posts the rules job's scan result to that Rerail remote. Never sees the model key or a GitHub token.
#   respond  as post, plus organization members:read, for help / stop / failure reports.
#            Pushes never start a job: they neither review nor withdraw the bot's approval.
name: reviewer

on:
  workflow_call:
    inputs:
      app_client_id:
        description: neralabs-reviewer client ID (vars.REVIEWER_APP_CLIENT_ID)
        required: true
        type: string
      reviewer_ref:
        description: Ref of neralabs/reviewer to load the skill, prompts and poster from. Keep it equal to the @ref in `uses:`.
        required: false
        type: string
        default: main
      team_slug:
        description: Team whose review request triggers a review
        required: false
        type: string
        default: reviewer
      handle:
        description: Comment handle for commands
        required: false
        type: string
        default: "@neralabs-reviewer"
      bot_login:
        required: false
        type: string
        default: neralabs-reviewer[bot]
      allow_approve:
        description: Let the poster approve low-risk PRs. Off in rollout phase 1.
        required: false
        type: boolean
        default: false
      provider:
        description: Where Claude runs. `anthropic` (the Claude API; secret REVIEWER_ANTHROPIC_API_KEY) or `bedrock` (Amazon Bedrock; secret REVIEWER_BEDROCK_API_KEY and `aws_region`).
        required: true
        type: string
      model:
        description: Pinned model id rather than an alias, so reviews don't change model under you. Claude API, e.g. `claude-opus-5-5`; Bedrock, a model id or inference profile, e.g. `us.anthropic.claude-opus-5-5`.
        required: true
        type: string
      aws_region:
        description: Bedrock region (provider bedrock only), e.g. `us-east-1`
        required: false
        type: string
        default: ""
      max_budget_usd:
        description: Spend cap for one review run
        required: false
        type: string
        default: "15"
      claude_code_version:
        required: false
        type: string
        default: 2.1.299
      large_pr_lines:
        description: Changed lines (excluding generated files) above which a review is summary-only, unless `review full`. A repo's REVIEW.md `largePrLines` overrides it.
        required: false
        type: number
        default: 50000
      rerail_package:
        description: Turns on rule-aware review. What `npm install --global` installs Rerail from (an npm spec such as `@neralabs/rerail@0.2.0`, or a tarball URL). The secret RERAIL_PACKAGE_URL, when set, is used instead. Empty and no secret = off.
        required: false
        type: string
        default: ""
      rerail_packs:
        description: Rerail rule packs to scan with besides the repository's `.rerail/rules/`, space-separated pack ids (each installed with `rerail packs add`).
        required: false
        type: string
        default: ""
      send_results:
        description: Send the Rerail scan result to the Rerail remote in the secrets RERAIL_REMOTE_URL and RERAIL_REMOTE_TOKEN. Off by default; see docs/privacy.md.
        required: false
        type: boolean
        default: false
    secrets:
      REVIEWER_APP_PRIVATE_KEY:
        description: Private key of the GitHub App the reviewer posts as
        required: true
      REVIEWER_ANTHROPIC_API_KEY:
        description: Claude API key (provider anthropic)
        required: false
      REVIEWER_BEDROCK_API_KEY:
        description: Amazon Bedrock API key (provider bedrock)
        required: false
      RERAIL_PACKAGE_URL:
        description: Where to install Rerail from, when it must not appear in a public file (for example a short-lived tarball URL). Overrides rerail_package.
        required: false
      RERAIL_REMOTE_URL:
        description: Base URL of the Rerail remote that receives scan results (send_results). A secret, so no endpoint sits in the caller file.
        required: false
      RERAIL_REMOTE_TOKEN:
        description: Bearer token for RERAIL_REMOTE_URL.
        required: false

permissions: {}

env:
  REVIEWER_TEAM_SLUG: ${{ inputs.team_slug }}
  REVIEWER_HANDLE: ${{ inputs.handle }}
  REVIEWER_BOT_LOGIN: ${{ inputs.bot_login }}
  REVIEWER_ALLOW_APPROVE: ${{ inputs.allow_approve }}
  REVIEWER_LARGE_PR_LINES: ${{ inputs.large_pr_lines }}
  REVIEWER_WORK: work
  REVIEWER_HOME: reviewer
  NODE_VERSION: "24"

jobs:
  gate:
    # Cheap prefilter, so most events never start a runner: pushes (they neither review nor withdraw an
    # approval), ordinary comments, fork PRs' team requests and thread replies, and any bot's team request. PR events count only
    # as pull_request_target, which runs the caller from the base branch: on pull_request GitHub runs the
    # PR's own copy of the caller, which the PR could rewrite (approvals on, another reviewer ref).
    if: >-
      (github.event_name == 'pull_request_target'
        && github.event.action == 'review_requested'
        && github.event.pull_request.head.repo.full_name == github.repository
        && github.event.requested_team.slug == inputs.team_slug
        && github.event.sender.type != 'Bot')
      || (((github.event_name == 'issue_comment' && github.event.issue.pull_request)
          || (github.event_name == 'pull_request_review_comment'
            && github.event.pull_request.head.repo.full_name == github.repository))
        && github.event.action == 'created'
        && github.event.comment.user.type != 'Bot'
        && (contains(github.event.comment.body, inputs.handle)
          || contains(github.event.comment.body, format('@{0}/{1}', github.repository_owner, inputs.team_slug))))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: read
    outputs:
      mode: ${{ steps.gate.outputs.mode }}
      pr: ${{ steps.gate.outputs.pr }}
      head_sha: ${{ steps.gate.outputs.head_sha }}
    steps:
      # The reviewer's own source, at the ref the caller pinned. Public, so no app token: the gate never
      # holds the app key, whoever wrote the comment that started it.
      - uses: actions/checkout@v7
        with:
          repository: neralabs/reviewer
          ref: ${{ inputs.reviewer_ref }}
          path: reviewer
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Gate
        id: gate
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node reviewer/poster/src/cli.ts gate

      - name: Hand the source and decision to later jobs
        if: steps.gate.outputs.mode != 'skip'
        uses: actions/upload-artifact@v7
        with:
          name: reviewer-bundle
          path: |
            reviewer/
            work/gate.json
          retention-days: 3
          if-no-files-found: error

  # Rule-aware review: a deterministic Rerail scan of the PR, before the model, in a job with no keys. Runs for
  # every review so the review job's needs stay simple; its steps do nothing when the caller hasn't turned it on.
  # A failed install or scan never stops the review: the result says it failed and the model reviews without it.
  rules:
    needs: gate
    if: needs.gate.outputs.mode == 'review' || needs.gate.outputs.mode == 'rereview'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      on: ${{ steps.on.outputs.on }}
    steps:
      - name: Is rule-aware review on
        id: on
        env:
          PACKAGE: ${{ inputs.rerail_package }}
          PACKAGE_URL: ${{ secrets.RERAIL_PACKAGE_URL }}
        run: |
          if [ -n "$PACKAGE_URL$PACKAGE" ]; then on=true; else on=false; fi
          echo "on=$on" >> "$GITHUB_OUTPUT"
          echo "rule-aware review: $on"

      - uses: actions/download-artifact@v8
        if: steps.on.outputs.on == 'true'
        with:
          name: reviewer-bundle

      # Data only: Rerail parses the files, it doesn't run them. The rules come from the base branch (--rules-ref).
      - name: Check out the PR head
        if: steps.on.outputs.on == 'true'
        uses: actions/checkout@v7
        with:
          ref: refs/pull/${{ needs.gate.outputs.pr }}/head
          path: work/pr
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v7
        if: steps.on.outputs.on == 'true'
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install Rerail
        if: steps.on.outputs.on == 'true'
        continue-on-error: true
        env:
          PACKAGE: ${{ inputs.rerail_package }}
          PACKAGE_URL: ${{ secrets.RERAIL_PACKAGE_URL }}
          PACKS: ${{ inputs.rerail_packs }}
        # Scripts stay on: Rerail's postinstall places its native engine.
        run: |
          npm install --global "${PACKAGE_URL:-$PACKAGE}"
          rerail --version
          for pack in $PACKS; do rerail packs add "$pack"; done

      - name: Scan the PR against the repository's Rerail rules
        if: steps.on.outputs.on == 'true'
        env:
          REVIEWER_RERAIL_PACKS: ${{ inputs.rerail_packs }}
        run: node reviewer/poster/src/cli.ts rules

      - name: Hand the scan to the review
        if: steps.on.outputs.on == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: reviewer-rules
          path: work/rules/
          retention-days: 3
          if-no-files-found: error

  # Opt-in: the scan result goes to the caller's Rerail remote. Only the remote's URL and token; no model key,
  # no GitHub token, nothing from the model. A failure here never touches the review.
  send:
    needs: [gate, rules]
    if: inputs.send_results && needs.rules.outputs.on == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: reviewer-bundle

      - uses: actions/download-artifact@v8
        with:
          name: reviewer-rules
          path: work/rules

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Send the scan result to the Rerail remote
        env:
          RERAIL_REMOTE_URL: ${{ secrets.RERAIL_REMOTE_URL }}
          RERAIL_REMOTE_TOKEN: ${{ secrets.RERAIL_REMOTE_TOKEN }}
        run: node reviewer/poster/src/cli.ts send work/rules/scan.json pr

  review:
    needs: [gate, rules]
    if: needs.gate.outputs.mode == 'review' || needs.gate.outputs.mode == 'rereview'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # A newer request for the same PR supersedes this one; `stop` cancels it.
    concurrency:
      group: reviewer-${{ github.repository }}-${{ needs.gate.outputs.pr }}
      cancel-in-progress: true
    permissions:
      contents: read
      pull-requests: read
      checks: read
      statuses: read
      actions: read
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: reviewer-bundle

      - uses: actions/download-artifact@v8
        if: needs.rules.outputs.on == 'true'
        with:
          name: reviewer-rules
          path: work/rules

      - name: Check out the PR head
        uses: actions/checkout@v7
        with:
          ref: refs/pull/${{ needs.gate.outputs.pr }}/head
          path: work/pr
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Prepare the review context
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node reviewer/poster/src/cli.ts prepare

      - name: Install Claude Code
        env:
          CLAUDE_CODE_VERSION: ${{ inputs.claude_code_version }}
        # Scripts stay on: the package's pinned postinstall copies the native binary over a placeholder.
        run: |
          npm install --global "@anthropic-ai/claude-code@${CLAUDE_CODE_VERSION}"
          claude --version
          node reviewer/poster/src/cli.ts agents work/agents.json

      - name: Review
        working-directory: work
        env:
          # Only the chosen provider's credential reaches the step; run-claude.sh checks the pairing.
          REVIEWER_PROVIDER: ${{ inputs.provider }}
          ANTHROPIC_API_KEY: ${{ inputs.provider == 'anthropic' && secrets.REVIEWER_ANTHROPIC_API_KEY || '' }}
          AWS_REGION: ${{ inputs.provider == 'bedrock' && inputs.aws_region || '' }}
          AWS_BEARER_TOKEN_BEDROCK: ${{ inputs.provider == 'bedrock' && secrets.REVIEWER_BEDROCK_API_KEY || '' }}
          MODEL: ${{ inputs.model }}
          MAX_BUDGET_USD: ${{ inputs.max_budget_usd }}
        # Through bash: artifacts don't keep the executable bit.
        run: bash ../reviewer/scripts/run-claude.sh

      # The artifact isn't masked like the step log, and it holds raw tool results. A step of its own, so it
      # also runs when the review step fails or the job times out; if redaction fails, nothing is uploaded.
      - name: Redact the Claude Code session
        if: always()
        working-directory: work
        run: |
          node ../reviewer/poster/src/cli.ts redact transcript.jsonl transcript.md ||
            { echo "::warning::Could not redact the session transcript, so it is not kept."; rm -f transcript.jsonl transcript.md; }

      - name: Keep the Claude Code session
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reviewer-transcript
          path: |
            work/transcript.md
            work/transcript.jsonl
          retention-days: 14
          if-no-files-found: ignore

      - name: Hand the findings to the poster
        uses: actions/upload-artifact@v7
        with:
          name: reviewer-findings
          path: |
            work/findings.json
            work/context/manifest.json
          retention-days: 3
          if-no-files-found: error

  post:
    needs: [gate, review]
    if: needs.review.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: reviewer-${{ github.repository }}-${{ needs.gate.outputs.pr }}
      cancel-in-progress: true
    permissions:
      contents: read
      pull-requests: read
      checks: read
      statuses: read
      actions: read
    steps:
      - name: Mint the neralabs-reviewer token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ inputs.app_client_id }}
          private-key: ${{ secrets.REVIEWER_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-pull-requests: write
          permission-contents: read
          # The poster requests and removes the reviewer team; GitHub ignores an app's changes to team requests without this.
          permission-members: read

      - uses: actions/download-artifact@v8
        with:
          name: reviewer-bundle

      - uses: actions/download-artifact@v8
        with:
          name: reviewer-findings
          path: work

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install the poster's dependencies
        working-directory: reviewer/poster
        run: npm ci --ignore-scripts --omit=dev

      - name: Post the review
        env:
          GITHUB_TOKEN: ${{ github.token }}
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
        run: node reviewer/poster/src/cli.ts post

  respond:
    needs: gate
    if: contains(fromJSON('["help", "stop"]'), needs.gate.outputs.mode)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # `stop` joins the PR's review group, which cancels a review in progress.
    concurrency:
      group: ${{ needs.gate.outputs.mode == 'stop' && format('reviewer-{0}-{1}', github.repository, needs.gate.outputs.pr) || format('reviewer-respond-{0}', github.run_id) }}
      cancel-in-progress: true
    permissions:
      pull-requests: read
    steps:
      - name: Mint the neralabs-reviewer token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ inputs.app_client_id }}
          private-key: ${{ secrets.REVIEWER_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-pull-requests: write
          permission-contents: read
          permission-members: read

      - uses: actions/download-artifact@v8
        with:
          name: reviewer-bundle

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Respond
        env:
          GITHUB_TOKEN: ${{ github.token }}
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
          MODE: ${{ needs.gate.outputs.mode }}
        run: node reviewer/poster/src/cli.ts respond "$MODE"

  report-failure:
    needs: [gate, rules, review, post, respond]
    if: always() && (needs.rules.result == 'failure' || needs.review.result == 'failure' || needs.post.result == 'failure' || needs.respond.result == 'failure')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: read
    steps:
      - name: Mint the neralabs-reviewer token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ inputs.app_client_id }}
          private-key: ${{ secrets.REVIEWER_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-pull-requests: write
          permission-contents: read

      - uses: actions/download-artifact@v8
        with:
          name: reviewer-bundle

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Report the failure on the PR
        env:
          GITHUB_TOKEN: ${{ github.token }}
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
        run: node reviewer/poster/src/cli.ts respond failure
