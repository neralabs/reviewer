# Reusable workflow: a Rerail scan of a whole branch, meant for a `schedule` trigger. Target repos call it with
# templates/scan-caller.yml. It shows how the codebase as a whole keeps to its Rerail rules; no model runs.
#
# Credentials, by job:
#   scan     GITHUB_TOKEN (contents: read) for the checkouts only; RERAIL_PACKAGE_URL if the caller passes it, and
#            RERAIL_REMOTE_URL and RERAIL_REMOTE_TOKEN in the install step only, for rerail_package remote:<v>.
#            Installs Rerail, scans the branch with its own merged rules, uploads the result (`rerail-scan`):
#            scan.json (Rerail's rerail.scan/1 result) and findings.json (the reviewer's findings schema, with
#            ruleId on every finding).
#   send     only RERAIL_REMOTE_URL and RERAIL_REMOTE_TOKEN; runs only when the caller sets send_results.
name: rerail-scan

on:
  workflow_call:
    inputs:
      reviewer_ref:
        description: Ref of neralabs/reviewer to load the poster from. Keep it equal to the @ref in `uses:`.
        required: false
        type: string
        default: main
      ref:
        description: Branch, tag or SHA to scan. Empty = the ref that triggered the run (the default branch for `schedule`).
        required: false
        type: string
        default: ""
      rerail_package:
        description: What `npm install --global` installs Rerail from (an npm spec, or a tarball URL), or `remote:<version>` to download it from the Rerail remote in RERAIL_REMOTE_URL with RERAIL_REMOTE_TOKEN. The secret RERAIL_PACKAGE_URL, when set, is used instead. One of the two is required.
        required: false
        type: string
        default: ""
      rerail_packs:
        description: Rerail rule packs to scan with besides the repository's `.rerail/rules/`, space-separated pack ids.
        required: false
        type: string
        default: ""
      rerail_repo_packs:
        description: Rule packs that live in this repository, space-separated paths from its root (e.g. `packs/team`). From the scanned branch, added to the runner's Rerail home and approved there, then scanned with.
        required: false
        type: string
        default: ""
      send_results:
        description: Send the scan result to the Rerail remote in the secrets RERAIL_REMOTE_URL and RERAIL_REMOTE_TOKEN. Off by default; see docs/privacy.md.
        required: false
        type: boolean
        default: false
    secrets:
      RERAIL_PACKAGE_URL:
        description: Where to install Rerail from, when it must not appear in a public file. Overrides rerail_package.
        required: false
      RERAIL_REMOTE_URL:
        description: Base URL of the Rerail remote that receives the result (send_results).
        required: false
      RERAIL_REMOTE_TOKEN:
        description: Bearer token for RERAIL_REMOTE_URL.
        required: false
    outputs:
      violations:
        description: Number of violations found
        value: ${{ jobs.scan.outputs.violations }}

permissions: {}

env:
  NODE_VERSION: "24"

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      violations: ${{ steps.scan.outputs.violations }}
    steps:
      - uses: actions/checkout@v7
        with:
          repository: neralabs/reviewer
          ref: ${{ inputs.reviewer_ref }}
          path: reviewer
          persist-credentials: false

      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
          path: work/repo
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      # A throwaway Rerail home for this job: packs and approvals live here and nowhere else.
      - name: Rerail home
        run: echo "RERAIL_HOME=$RUNNER_TEMP/rerail-home" >> "$GITHUB_ENV"

      - name: Install Rerail
        env:
          PACKAGE: ${{ inputs.rerail_package }}
          RERAIL_PACKAGE_URL: ${{ secrets.RERAIL_PACKAGE_URL }}
          PACKS: ${{ inputs.rerail_packs }}
          RERAIL_REMOTE_URL: ${{ startsWith(inputs.rerail_package, 'remote:') && secrets.RERAIL_REMOTE_URL || '' }}
          RERAIL_REMOTE_TOKEN: ${{ startsWith(inputs.rerail_package, 'remote:') && secrets.RERAIL_REMOTE_TOKEN || '' }}
        run: bash reviewer/scripts/install-rerail.sh

      # The branch's own merged rules and repository packs, approved through Rerail's normal mechanism, then the
      # scan. Exit 1 is a failed scan that may still print its result; the findings step below says so.
      - name: Scan the branch
        id: scan
        working-directory: work/repo
        env:
          PACKS: ${{ inputs.rerail_packs }}
          REVIEWER_RERAIL_REPO_PACKS: ${{ inputs.rerail_repo_packs }}
        run: |
          repo_packs="$(node ../../reviewer/poster/src/cli.ts approve .)"
          args=(scan --scope repository --rules-ref HEAD --json)
          for pack in $PACKS $repo_packs; do args+=(--pack "$pack"); done
          status=0
          rerail "${args[@]}" > ../scan.json || status=$?
          if [ "$status" -gt 1 ] || ! [ -s ../scan.json ]; then
            echo "::error::rerail scan exited $status"
            exit 1
          fi
          echo "violations=$(jq '.summary.violations' ../scan.json)" >> "$GITHUB_OUTPUT"

      - name: Findings document
        run: node reviewer/poster/src/cli.ts scan-findings work/scan.json work/findings.json

      - uses: actions/upload-artifact@v7
        with:
          name: rerail-scan
          path: |
            work/scan.json
            work/findings.json
          retention-days: 30
          if-no-files-found: error

  send:
    needs: scan
    if: inputs.send_results
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - uses: actions/checkout@v7
        with:
          repository: neralabs/reviewer
          ref: ${{ inputs.reviewer_ref }}
          path: reviewer
          persist-credentials: false

      - uses: actions/download-artifact@v8
        with:
          name: rerail-scan
          path: work

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Send the scan result to the Rerail remote
        env:
          RERAIL_REMOTE_URL: ${{ secrets.RERAIL_REMOTE_URL }}
          RERAIL_REMOTE_TOKEN: ${{ secrets.RERAIL_REMOTE_TOKEN }}
        run: node reviewer/poster/src/cli.ts send work/scan.json scheduled
