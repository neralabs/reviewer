name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  poster:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: poster
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm test

  workflows:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: actionlint
        uses: docker://rhysd/actionlint:1.7.12
        with:
          args: -color
      - name: shellcheck
        run: shellcheck scripts/*.sh modules/*/*.sh poster/test/fixtures/modules/*/run.sh packs/*/test.sh

  licenses:
    name: Licences (REUSE and copyleft gate)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - uses: astral-sh/setup-uv@v7
      # Every file carries licence information and every licence it names has its text in LICENSES/.
      - name: REUSE lint
        run: uvx --from 'reuse[charset-normalizer]==6.2.0' reuse lint
      # Only allowlisted (permissive) licences in LICENSES/, and no copyleft production dependency of the poster.
      - name: Licence allowlist and copyleft gate
        run: node scripts/check/check-licenses.mjs

  internal-refs:
    name: Internal references
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: No ticket IDs, AWS account IDs or staff addresses
        run: node scripts/check/check-internal-refs.mjs

  # The repository's own rule pack (packs/reviewer): every rule is valid and gets its cases right, and the pack installs
  # and scans this checkout the way a scan of the repository runs it. Violations are listed, not failed on.
  rerail-pack:
    name: Rerail pack
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      RERAIL_VERSION: 0.1.5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Install Rerail
        run: npm install --global --ignore-scripts "@neralabs/rerail@$RERAIL_VERSION"
      - name: Test the rules against their cases
        run: packs/reviewer/test.sh
      - name: Add, approve and scan with the pack
        env:
          RERAIL_EXPERIMENTAL_HEADLESS_SCAN: "1"
        run: |
          set -euo pipefail
          export RERAIL_HOME="$RUNNER_TEMP/rerail-home"
          rerail packs add ./packs/reviewer
          rerail rules approve @neralabs/rerail-pack-reviewer
          rerail scan --json --no-send --pack reviewer >"$RUNNER_TEMP/scan.json"
          {
            echo "| Rule | Mode | Violations |"
            echo "| --- | --- | --: |"
            jq -r '.violations as $v | .rules[] | .ruleId as $id
              | "| \($id) | \(.mode) | \([$v[] | select(.ruleId == $id)] | length) |"' "$RUNNER_TEMP/scan.json"
          } | tee -a "$GITHUB_STEP_SUMMARY"
          jq -r '.violations[] | "::warning file=\(.path),line=\(.start.line // 1)::\(.ruleId): \(.message)"' "$RUNNER_TEMP/scan.json"
          # Fails when the scan didn't complete, or the approval didn't bind and the rules ran in Log.
          jq -e '.status == "completed" and (.failures | length) == 0 and ([.rules[] | select(.mode == "log")] | length) == 0' \
            "$RUNNER_TEMP/scan.json" >/dev/null

  # The one check to require. It needs every other job and fails when any of them failed or was cancelled.
  ci-result:
    name: CI result
    needs:
      - poster
      - workflows
      - licenses
      - internal-refs
      - rerail-pack
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Fail when a job failed or was cancelled
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          {
            echo "| Job | Result |"
            echo "| --- | --- |"
            jq -r 'to_entries | sort_by(.key) | .[] | "| \(.key) | \(.value.result) |"' <<< "$NEEDS"
          } | tee -a "$GITHUB_STEP_SUMMARY"
          failed="$(jq -r '[to_entries[] | select(.value.result == "failure" or .value.result == "cancelled") | .key] | sort | join(", ")' <<< "$NEEDS")"
          if [ -n "$failed" ]; then
            echo "::error::failed or cancelled: $failed"
            exit 1
          fi
