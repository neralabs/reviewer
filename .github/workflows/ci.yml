name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  poster:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: poster
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm test

  workflows:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: actionlint
        uses: docker://rhysd/actionlint:1.7.12
        with:
          args: -color
      - name: shellcheck
        run: shellcheck scripts/*.sh modules/*/*.sh poster/test/fixtures/modules/*/run.sh packs/*/test.sh

  licenses:
    name: Licences (REUSE and copyleft gate)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - uses: astral-sh/setup-uv@v7
      # Every file carries licence information and every licence it names has its text in LICENSES/.
      - name: REUSE lint
        run: uvx --from 'reuse[charset-normalizer]==6.2.0' reuse lint
      # Only allowlisted (permissive) licences in LICENSES/, and no copyleft production dependency of the poster.
      - name: Licence allowlist and copyleft gate
        run: node scripts/check/check-licenses.mjs

  internal-refs:
    name: Internal references
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: No ticket IDs, AWS account IDs or staff addresses
        run: node scripts/check/check-internal-refs.mjs

  # The repository's own rule pack (packs/reviewer): every rule is valid and gets its cases right, and the Rerail module
  # scans this checkout with it as a scheduled scan of the repository runs it. Violations are listed, not failed on.
  rerail-pack:
    name: Rerail pack
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      # The module's own install with rerail_package empty: the release modules/rerail/pin/package.json pins.
      - name: Install Rerail
        run: bash modules/rerail/install.sh
      - name: Test the rules against their cases
        run: packs/reviewer/test.sh
      # The module (modules/rerail/run.ts) in repository mode, with rerail_packs and rerail_repo_packs empty, so the
      # packs .rerail/packs.json lists decide: no --pack, packs/reviewer approved from this checkout. A Rerail that
      # doesn't read that file (0.1.5 doesn't) would run no pack then, so it gets packs/reviewer as rerail_repo_packs.
      - name: Scan with the Rerail module
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/rerail-module"
          mkdir -p "$work/home" "$work/out"
          export RERAIL_HOME="$work/home/rerail-home"
          # The module's own probe. The home comes first: run.ts runs main() when argv[1] is run.ts itself.
          if ! node --input-type=module -e \
            'const m = await import(process.argv[2]); process.exit(m.readsPacksFile(process.argv[1]) ? 0 : 1)' \
            "$work/home" "$GITHUB_WORKSPACE/modules/rerail/run.ts"; then
            export RERAIL_REPO_PACKS=packs/reviewer
          fi
          head="$(git rev-parse HEAD)"
          MODULE_MODE=repository MODULE_CHECKOUT="$GITHUB_WORKSPACE" MODULE_BASE_CHECKOUT="$GITHUB_WORKSPACE" \
            MODULE_BASE_SHA="$head" MODULE_MERGE_BASE="$head" MODULE_HOME="$work/home" MODULE_OUT="$work/out" \
            node modules/rerail/run.ts
          if ! jq -e '.status == "completed"' "$work/out/results.json" >/dev/null; then
            echo "::error::Rerail module: $(jq -r .error "$work/out/results.json")"
            exit 1
          fi
          scan="$work/out/raw/scan.json"
          {
            echo "| Pack | Rule | Mode | Violations |"
            echo "| --- | --- | --- | --: |"
            jq -r '.violations as $v | .rules[] | .ruleId as $id
              | "| \(.source.packId // "") | \($id) | \(.mode) | \([$v[] | select(.ruleId == $id)] | length) |"' "$scan"
          } | tee -a "$GITHUB_STEP_SUMMARY"
          jq -r '.violations[] | "::warning file=\(.path),line=\(.start.line // 1)::\(.ruleId): \(.message)"' "$scan"
          # Fails when the scan didn't complete, packs/reviewer didn't run, or its approval didn't bind and it ran in
          # Log. Other packs' rules keep their own modes, Log included.
          jq -e '.status == "completed" and (.failures | length) == 0
            and ([.rules[] | select(.source.packId == "reviewer")] | length) > 0
            and ([.rules[] | select(.source.packId == "reviewer" and .mode == "log")] | length) == 0' "$scan" >/dev/null

  # The one check to require. It needs every other job and fails when any of them failed or was cancelled.
  ci-result:
    name: CI result
    needs:
      - poster
      - workflows
      - licenses
      - internal-refs
      - rerail-pack
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Fail when a job failed or was cancelled
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          {
            echo "| Job | Result |"
            echo "| --- | --- |"
            jq -r 'to_entries | sort_by(.key) | .[] | "| \(.key) | \(.value.result) |"' <<< "$NEEDS"
          } | tee -a "$GITHUB_STEP_SUMMARY"
          failed="$(jq -r '[to_entries[] | select(.value.result == "failure" or .value.result == "cancelled") | .key] | sort | join(", ")' <<< "$NEEDS")"
          if [ -n "$failed" ]; then
            echo "::error::failed or cancelled: $failed"
            exit 1
          fi
