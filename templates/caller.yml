# Copy to .github/workflows/reviewer.yml in a repo that opts in to neralabs/reviewer.
# Also add a REVIEW.md (templates/REVIEW.md) and a CODEOWNERS.
#
# The bot reviews only when asked: someone requests the @neralabs/reviewer team as a reviewer (request it
# again for another review; the bot clears the request after each review) or comments "@neralabs-reviewer review"
# (see "@neralabs-reviewer help"). Pushes do nothing: they neither start a review nor withdraw the bot's approval.
name: reviewer

on:
  # pull_request_target, not pull_request: GitHub then runs this file from the base branch, so a PR can't
  # rewrite its own reviewer configuration. Safe here because nothing from the PR is executed: the reviewer
  # checks the PR out as data and never runs it. Fork PRs: team requests and finding-thread replies are
  # ignored (they get no secrets); a top-level comment command from someone with write access reviews a fork
  # PR, and fork PRs are never approved.
  pull_request_target:
    types: [review_requested]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

# Read-only. Writes go through the neralabs-reviewer token the reviewer mints per job.
permissions:
  contents: read
  pull-requests: read
  checks: read
  statuses: read
  actions: read

jobs:
  reviewer:
    uses: neralabs/reviewer/.github/workflows/review.yml@main
    with:
      app_client_id: ${{ vars.REVIEWER_APP_CLIENT_ID }}
      reviewer_ref: main # keep equal to the @ref above
      allow_approve: false # rollout phase 1: comment and request changes only
      # Where Claude runs, and a pinned model id.
      provider: anthropic
      model: claude-opus-5-5
      # Amazon Bedrock instead:
      # provider: bedrock
      # model: us.anthropic.claude-opus-5-5 # or an inference profile ARN
      # aws_region: us-east-1
    # Name each secret instead of `secrets: inherit`, which would hand the reviewer every secret this
    # repo can see.
    secrets:
      REVIEWER_APP_PRIVATE_KEY: ${{ secrets.REVIEWER_APP_PRIVATE_KEY }}
      REVIEWER_ANTHROPIC_API_KEY: ${{ secrets.REVIEWER_ANTHROPIC_API_KEY }}
      # REVIEWER_BEDROCK_API_KEY: ${{ secrets.REVIEWER_BEDROCK_API_KEY }}
